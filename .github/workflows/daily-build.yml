name: 1.0 每日自动构建

on:
  schedule:
    # 北京时间每天 02:00、17:00；无新提交时跳过。
    - cron: '0 9,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-nightly
  cancel-in-progress: true

jobs:
  check:
    if: github.ref == 'refs/heads/1.0'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 检查是否需要构建
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          previous=$(git rev-parse --verify 'refs/tags/1.0-nightly^{commit}' 2>/dev/null || true)
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ "$previous" != "$(git rev-parse HEAD)" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "没有新提交，跳过构建。"
          fi
  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: 构建并校验 Release
        uses: ./.github/actions/build-apks
        with:
          key-base64: ${{ secrets.KEY_BASE64 }}
          signing-config: ${{ secrets.SIGNING_CONFIG }}
          google-services: ${{ secrets.GOOGLE_SERVICES_JSON_1_0 || secrets.GOOGLE_SERVICES_JSON }}
      - name: 更新开发构建标签
        uses: actions/github-script@v7
        with:
          script: |
            const ref = 'tags/1.0-nightly';
            try {
              await github.rest.git.getRef({ ...context.repo, ref });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ ...context.repo, ref: 'refs/' + ref, sha: context.sha });
              return;
            }
            await github.rest.git.updateRef({ ...context.repo, ref, sha: context.sha, force: true });
      - name: 发布开发构建
        uses: softprops/action-gh-release@v3
        with:
          tag_name: 1.0-nightly
          name: RikkaPlus 1.0 开发构建
          body_path: release-notes.md
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/*.apk
            SHA256SUMS.txt
